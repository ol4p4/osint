name: JEV Free Channel Probe (temporary)

# 临时探测：验证 GitHub Actions runner 能否免 key 访问 opencode.ai 的
# jev-1.13-free 通道。验证完即删（或保留为可用性监控）。
# 背景：CI 的 GitHub Secrets 只有 GEMINI/NVIDIA/OPENCODE，没有 TYPESAFE_API_KEY，
# 所以 ACH 判断在 CI 上此前根本跑不了。免 key 通道若能通，判断链才可能上线。

on:
  workflow_dispatch:

jobs:
  probe:
    name: Probe keyless JEV endpoint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Probe with curl (no auth header)
        run: |
          echo "=== curl keyless（带 UA）==="
          curl -sS --max-time 30 -w "\nHTTP=%{http_code} time=%{time_total}s\n" \
            -X POST "https://opencode.ai/zen/v1/systemone" \
            -H "Content-Type: application/json" \
            -H "User-Agent: osint-jev/1.0" \
            -d '{"model":"jev-1.13-free","state":"2026年8月中国青年失业率升至17.1%","questions":{"q":{"type":"noul","instructions":"这条情报是否涉及就业形势？"}}}' || echo "curl FAILED"
          echo ""
          echo "=== curl 无 UA（预期 403，验证 UA 是否必需）==="
          curl -sS --max-time 30 -o /dev/null -w "no-UA HTTP=%{http_code}\n" \
            -X POST "https://opencode.ai/zen/v1/systemone" \
            -H "Content-Type: application/json" \
            -H "User-Agent:" \
            -d '{"model":"jev-1.13-free","state":"test","questions":{"q":{"type":"noul","instructions":"yes?"}}}' || echo "curl FAILED"

      - name: Probe with project client (Python, 8-question ACH gate)
        run: |
          python - <<'PY'
          import sys, json, time
          sys.path.insert(0, "local")
          try:
              from jev_client import JevClient
          except Exception as e:
              print("IMPORT FAIL:", e); sys.exit(1)
          c = JevClient(caller="ci_probe")
          print("通道:", c.describe())
          print("available:", c.available)
          if not c.available:
              print("NO CHANNEL"); sys.exit(1)
          majors = [
              {"id": "HM001", "title": "台海冲突升级风险",
               "rationale": "台海地区发生军事冲突或局势显著升级，包括实弹演习、军事对峙、封锁。"},
              {"id": "HM102", "title": "AI算力与关键材料短缺限制技术商业化速度",
               "rationale": "AI算力供给与关键材料不足，拖慢技术落地与商业化。"},
          ]
          cases = [
              ("解放军在台海周边海域组织实弹射击演习", "信号(应 HM001 高 gate)"),
              ("1至8月全国铁路发送旅客33.2亿人次", "噪声(应全低 gate)"),
          ]
          for text, label in cases:
              t0 = time.time()
              got = c.gate_and_diagnose(text, majors)
              print("\n[" + label + "] " + "%.2fs" % (time.time() - t0))
              for hid, v in sorted(got.items(), key=lambda kv: -kv[1]["gate"]):
                  print("   %-7s gate=%.3f sel=%.2f -> %s(conf=%.2f)"
                        % (hid, v["gate"], v["selectivity"], v["code"], v["conf"]))
          print("\n=== CI 免 key 通道判定完成 ===")
          PY

      - name: Probe ach_matrix integration (stdlib only path)
        run: |
          python - <<'PY'
          import sys, json, time
          from pathlib import Path
          sys.path.insert(0, "local")
          from jev_client import JevClient
          from ach_matrix import ACHMatrix, derive_lr
          d = json.loads(Path("data/hypotheses/active_hypotheses.json").read_text(encoding="utf-8"))
          majors = [n for n in d if n.get("level") == "major"]
          print("majors:", len(majors))
          if not majors:
              print("NO MAJORS"); sys.exit(0)
          ach = ACHMatrix(Path("data/hypotheses/ach_matrix.json"), majors)
          jev = JevClient(caller="ci_probe_ach")
          print("通道:", jev.describe())
          ev = {"key": "ci_probe_1",
                "ev": {"date": "2026-10-08",
                       "summary": "美国商务部宣布扩大对华AI芯片出口管制，涉及英伟达H200",
                       "body": "新规限制先进AI芯片对华出口，影响数据中心与算力供应链。",
                       "source": "CI probe"}}
          t0 = time.time()
          diag = ach.ai_diagnose(ev, None, jev=jev)
          print("诊断 %.2fs, %d 个假设" % (time.time() - t0, len(diag)))
          for x in diag:
              lr = derive_lr(x["code"], x["conf"])
              if x["code"] != "N":
                  print("   %-7s %s conf=%.2f gate=%.3f LR=%.3f"
                        % (x["hyp_id"], x["code"], x["conf"], x.get("gate") or 0, lr))
          print("=== ACH 集成在 CI 上可用 ===")
          PY
