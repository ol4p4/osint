name: AI Channel Probe (temporary)

# 临时探针（2026-10-12）：验证云端各 AI 通道的真实可达性。
# 背景：CI 只显示"链首成功"，无法判断后备通道是否真能用——
# 而加备用腿的前提是"它在美国 runner 上通"，不能靠推测。
# 测完即删（项目既有范式：AGENTS.md 记载 2026-10-08 曾用临时探针 run 37723919445
# 验证 JEV 免 key 通道的 CI 可达性）。
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Probe channels
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          DOTS_API_KEY: ${{ secrets.DOTS_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          cd ${{ github.workspace }}
          python - <<'PY'
          import json, os, time, urllib.error, urllib.request

          def probe(url, model, headers, label, timeout=40):
              body = json.dumps({"model": model,
                                 "messages": [{"role": "user", "content": "hi"}],
                                 "max_tokens": 5}).encode()
              h = {"Content-Type": "application/json", **headers}
              t0 = time.time()
              try:
                  r = urllib.request.urlopen(
                      urllib.request.Request(url, data=body, headers=h), timeout=timeout)
                  print("  [OK]   %-26s HTTP %s  %.1fs" % (label, r.status, time.time() - t0))
                  return True
              except urllib.error.HTTPError as e:
                  print("  [FAIL] %-26s HTTP %s  %.1fs  %s"
                        % (label, e.code, time.time() - t0, e.read()[:120]))
              except Exception as e:
                  print("  [FAIL] %-26s %s  %.1fs  %s"
                        % (label, type(e).__name__, time.time() - t0, str(e)[:100]))
              return False

          ok = os.environ.get("OPENCODE_API_KEY", "")
          gk = os.environ.get("GEMINI_API_KEY", "")
          dk = os.environ.get("DOTS_API_KEY", "")
          nk = os.environ.get("NVIDIA_API_KEY", "")
          print("key 注入检查: opencode=%s gemini=%s dots=%s nvidia=%s"
                % (bool(ok), bool(gk), bool(dk), bool(nk)))
          print()

          oc = {"Authorization": "Bearer " + ok,
                "User-Agent": "opencode/latest/1.3.15/cli",
                "x-opencode-client": "cli"}

          print("=== 1. OpenCode 官网直连（云端是否可用）===")
          probe("https://opencode.ai/zen/v1/chat/completions", "mimo-v2.6-flash-free", oc, "opencode/mimo-v2.6")
          probe("https://opencode.ai/zen/v1/chat/completions", "nemotron-3.5-lightning-free", oc, "opencode/nemotron")

          print("=== 2. dots（新加的第二腿，US runner 是否可达）===")
          probe("https://note3-prev-api.askdiandian.com/v1/chat/completions", "dots3-note-prev",
                {"Authorization": "Bearer " + dk, "api-key": dk, "User-Agent": "Mozilla/5.0"}, "dots3-note-prev")

          print("=== 3. NVIDIA（配置了 key，看是否可用）===")
          probe("https://integrate.api.nvidia.com/v1/chat/completions", "z-ai/glm-5.3",
                {"Authorization": "Bearer " + nk}, "nvidia/glm-5.3")

          print("=== 4. JEV free（免 key，已知可用，做对照）===")
          probe("https://opencode.ai/zen/v1/systemone", "jev-1.13-free", oc, "jev-1.13-free")

          print("=== 5. /models 列表（看云端能否拉全量）===")
          try:
              req = urllib.request.Request("https://opencode.ai/zen/v1/models", headers=oc)
              d = json.loads(urllib.request.urlopen(req, timeout=30).read())
              ids = sorted(m.get("id", "") for m in d.get("data", []))
              free = [i for i in ids if i.endswith("-free")]
              print("  模型总数 %d / 免费 %d" % (len(ids), len(free)))
              print("  免费模型: %s" % ", ".join(free))
              hard = ["mimo-v2.6-flash-free", "nemotron-3.5-lightning-free",
                      "nemotron-3-ultra-free", "longcat-2.5-preview-free"]
              for m in hard:
                  print("    %-34s %s" % (m, "在列" if m in ids else "!! 已下线"))
          except Exception as e:
              print("  列表获取失败: %s %s" % (type(e).__name__, str(e)[:120]))
          PY
