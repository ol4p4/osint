name: RSSHub route check
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Check RSSHub instances x routes
        run: |
          ROUTES="gov/zhengce/zuixin zhihu/hotlist wallstreetcn/news/global 36kr/newsflashes"
          INSTANCES="https://rsshub.rssforever.com https://rsshub.ktachibana.party https://rsshub.pseudoyu.com https://rss.owo.nz https://rsshub.moeyy.cn"
          for inst in $INSTANCES; do
            echo "===== $inst ====="
            for route in $ROUTES; do
              code=$(curl -sL -o /tmp/out.xml -w "%{http_code}" --max-time 15 "$inst/$route" || echo ERR)
              items=$(grep -c "<item>" /tmp/out.xml 2>/dev/null || echo 0)
              head -c 300 /tmp/out.xml 2>/dev/null | grep -q "<rss" && v=RSS || v=no
              echo "  $route -> HTTP=$code items=$items valid=$v"
            done
          done
