name: Intelligence Pipeline (4x/day)

on:
  schedule:
    - cron: "0 2,8,14,20 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  collect:
    name: Collect & Analyze Intelligence
    runs-on: ubuntu-latest
    timeout-minutes: 25
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      
      - name: Install dependencies
        run: |
          pip install -q --upgrade pip
          pip install -q feedparser requests lxml pyyaml simhash
      
      - name: Collect RSS + List sources
        run: |
          cd ${{ github.workspace }}
          python cloud/main_cloud.py
      
      - name: Translate with NVIDIA API
        if: ${{ env.NVIDIA_API_KEY }}
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          cd ${{ github.workspace }}
          python -c "
          import json, urllib.request, os, glob, uuid
          
          api_key = os.environ['NVIDIA_API_KEY']
          base_url = 'https://integrate.api.nvidia.com/v1'
          model = 'nvidia/llama-3.1-nemotron-70b-instruct'
          
          files = sorted(glob.glob('intel_*.jsonl'), reverse=True)[:1]
          if not files:
              print('No intel files found')
              exit(0)
          
          items = []
          with open(files[0], 'r') as f:
              for line in f:
                  line = line.strip()
                  if line:
                      try: items.append(json.loads(line))
                      except: pass
          
          print(f'Translating {len(items)} items...')
          
          # Batch translate in groups of 5
          for i in range(0, min(len(items), 50), 5):
              batch = items[i:i+5]
              texts = []
              for item in batch:
                  title = item.get('title', '')
                  content = item.get('content_preview', '')[:500]
                  texts.append(f'ITEM: {title}\nCONTENT: {content}')
              
              prompt = 'Translate each ITEM to Chinese. Output JSON array with format: [{\"cn_title\": \"中文标题\", \"cn_summary\": \"4-6句中文摘要\", \"impact\": \"对中国经济和青年就业的影响\"}]. Only output JSON.'
              
              payload = json.dumps({
                  'model': model,
                  'messages': [{'role': 'user', 'content': prompt + chr(10) + chr(10).join(texts)}],
                  'temperature': 0.3,
                  'max_tokens': 4096
              }).encode()
              
              headers = {
                  'Content-Type': 'application/json',
                  'Authorization': f'Bearer {api_key}',
                  'User-Agent': 'opencode/latest/1.3.15/cli',
                  'x-opencode-client': 'cli',
                  'x-opencode-session': uuid.uuid4().hex
              }
              
              try:
                  req = urllib.request.Request(base_url + '/chat/completions', data=payload, headers=headers)
                  with urllib.request.urlopen(req, timeout=60) as resp:
                      result = json.loads(resp.read())
                      content = result['choices'][0]['message']['content']
                      # Clean markdown code blocks
                      content = content.strip()
                      if content.startswith('```'):
                          content = content.split('```')[1]
                          if content.startswith('json'):
                              content = content[4:]
                      translations = json.loads(content)
                      for j, trans in enumerate(translations):
                          if i+j < len(items):
                              items[i+j].update(trans)
                              items[i+j]['language'] = 'cn'
              except Exception as e:
                  print(f'  Translation batch {i} failed: {e}')
          
          with open(files[0], 'w') as f:
              for item in items:
                  f.write(json.dumps(item, ensure_ascii=False) + chr(10))
          
          print(f'Translated {len(items)} items')
          "
      
      - name: Link intel to hypotheses
        run: |
          cd ${{ github.workspace }}
          python link_intel_hyp.py || echo "Link step skipped (no hypotheses yet)"
      
      - name: Verify hypotheses
        run: |
          cd ${{ github.workspace }}
          python verify_hypotheses.py || echo "Verify step skipped"
      
      - name: Generate daily briefing
        run: |
          cd ${{ github.workspace }}
          python daily_briefing.py || echo "Briefing step skipped"
      
      - name: Sync dashboard data
        run: |
          cd ${{ github.workspace }}
          python sync_data.py || echo "Sync step skipped"
      
      - uses: actions/upload-artifact@v4
        with:
          name: intel-daily
          path: |
            intel_*.jsonl
            intel_summary_*.json
            briefing_*.md
            link_report.json
          retention-days: 30
      
      - name: Push updates back to repo
        run: |
          cd ${{ github.workspace }}
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add hypotheses/ link_report.json briefing_*.md
          git diff --staged --quiet || git commit -m "auto: daily intel update $(date -u +%Y-%m-%d)"
          git push || echo "Push failed"
      
      - name: Summary
        run: |
          echo "## Intelligence Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f intel_summary_*.json ]; then
            cat intel_summary_*.json | jq -r "
              \"**Date**: \\(.date)\n\",
              \"**Total Raw**: \\(.total_raw)\n\",
              \"**Total Final**: \\(.total_final)\n\",
              \"**By Category**: \\(.by_category | to_entries | map(\"\\(.key): \\(.value)\") | join(\", \"))\n\"
            " >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f link_report.json ]; then
            cat link_report.json | jq -r "\"**Linked Intel**: \\(.linked_intel)/\\(.total_intel)\", \"**Evidence Updates**: \\(.evidence_updates)\n\"" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f briefing_*.md ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Today's Briefing" >> $GITHUB_STEP_SUMMARY
            head -30 briefing_*.md >> $GITHUB_STEP_SUMMARY
          fi
