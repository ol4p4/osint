name: Intelligence Pipeline (6x/day)

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:
  push:
    branches: [master]
    # 仅配置/文档变更触发 (CI 自身只提交 intel jsonl, 不会命中这些路径 → 不会循环触发)
    paths:
      - "sources.yaml"
      - "config.yaml"
      - "requirements.txt"
      - "AGENTS.md"
      - "HANDOFF.md"
      - "docs/**"
      - ".github/workflows/**"

permissions:
  contents: write
  actions: write

jobs:
  collect:
    name: Collect & Analyze Intelligence
    runs-on: ubuntu-latest
    # 50 源串行抓取 (每源上限 15s) + RSSHub 容器 + 翻译/关联/验证, 25min 会顶满超时
    timeout-minutes: 40
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      
      - name: Install dependencies
        run: |
          pip install -q --upgrade pip
          pip install -q -r requirements.txt
      
      - name: Start RSSHub (local container, for Chinese sources)
        env:
          REUTERS_COOKIE: ${{ secrets.REUTERS_COOKIE }}
        run: |
          docker rm -f rsshub 2>/dev/null || true
          if [ -n "$REUTERS_COOKIE" ]; then
            docker run -d --name rsshub -p 1200:1200 -e REUTERS_COOKIE="$REUTERS_COOKIE" diygod/rsshub:latest
          else
            docker run -d --name rsshub -p 1200:1200 diygod/rsshub:latest
          fi
          timeout 90 bash -c 'until curl -s -o /dev/null http://localhost:1200/healthz; do sleep 3; done' || echo "RSSHub slow start, continue anyway"
          curl -s -o /dev/null -w "RSSHub ready: %{http_code}\n" http://localhost:1200/ || true

      - name: Collect RSS + List sources
        run: |
          cd ${{ github.workspace }}
          python cloud/main_cloud.py
      
      - name: Translate with NVIDIA API
        if: ${{ env.NVIDIA_API_KEY }}
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          cd ${{ github.workspace }}
          python cloud/translate.py
      - name: Citizen impact analysis
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          cd ${{ github.workspace }}
          python cloud/citizen_impact.py || echo "Impact step skipped"
      - name: Link intel to hypotheses
        run: |
          cd ${{ github.workspace }}
          python link_intel_hyp.py || echo "Link step skipped (no hypotheses yet)"
      
      - name: Verify hypotheses
        run: |
          cd ${{ github.workspace }}
          python verify_hypotheses.py || echo "Verify step skipped"
      
      - name: Generate daily briefing
        run: |
          cd ${{ github.workspace }}
          python daily_briefing.py || echo "Briefing step skipped"
      
      - name: Sync dashboard data
        run: |
          cd ${{ github.workspace }}
          python sync_data.py || echo "Sync step skipped"
      
      - uses: actions/upload-artifact@v4
        with:
          name: intel-daily
          path: |
            intel_*.jsonl
            intel_summary_*.json
            briefing_*.md
            link_report.json
          retention-days: 30
      
      - name: Commit and push translated intel
        run: |
          cd ${{ github.workspace }}
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          echo "=== Files in workspace ==="
          ls -la intel*.jsonl 2>/dev/null || echo "No intel*.jsonl found"
          TODAY=$(date -u +%Y%m%d)
          echo "Today=$TODAY"
          ls -la intel_${TODAY}.jsonl 2>/dev/null || echo "intel_${TODAY}.jsonl not found"
          ls -la intel_raw_${TODAY}.jsonl 2>/dev/null || echo "intel_raw_${TODAY}.jsonl not found"
          # 只提交 final 情报与摘要；raw/rss/list 中间产物不进 git（防仓库膨胀，本地合并不依赖它们）
          git add intel_${TODAY}.jsonl intel_summary_${TODAY}.json hypotheses/ briefing_*.md 2>/dev/null || true
          git add -A intel_2*.jsonl 2>/dev/null || true
          git status
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "auto: daily intel update $(date -u +%Y-%m-%d)"
            git push || echo "Push failed"
          fi
      
      - name: Summary
        run: |
          echo "## Intelligence Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f intel_summary_*.json ]; then
            cat intel_summary_*.json | jq -r "
              \"**Date**: \\(.date)\n\",
              \"**Total Raw**: \\(.total_raw)\n\",
              \"**Total Final**: \\(.total_final)\n\",
              \"**By Category**: \\(.by_category | to_entries | map(\"\\(.key): \\(.value)\") | join(\", \"))\n\"
            " >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f link_report.json ]; then
            cat link_report.json | jq -r "\"**Linked Intel**: \\(.linked_intel)/\\(.total_intel)\", \"**Evidence Updates**: \\(.evidence_updates)\n\"" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f briefing_*.md ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Today's Briefing" >> $GITHUB_STEP_SUMMARY
            head -30 briefing_*.md >> $GITHUB_STEP_SUMMARY
          fi
