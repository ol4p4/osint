name: Daily Intelligence Collection

on:
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  collect:
    name: Collect Intelligence
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      
      - name: Install dependencies
        run: |
          pip install -q --upgrade pip
          pip install -q feedparser requests lxml pyyaml simhash
      
      - name: Run cloud collector
        run: |
          cd ${{ github.workspace }}
          python cloud/main_cloud.py
      
      - uses: actions/upload-artifact@v4
        with:
          name: intel-daily
          path: |
            intel_*.jsonl
            intel_summary_*.json
          retention-days: 30
      
      - name: Push to private Gist
        if: ${{ env.GIST_TOKEN }}
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: |
          TODAY=$(date -u +%Y%m%d)
          FILE="intel_${TODAY}.jsonl"
          if [ -f "$FILE" ]; then
            GIST_ID="${{ secrets.GIST_ID }}"
            if [ -z "$GIST_ID" ]; then
              RESPONSE=$(curl -s -X POST \
                -H "Authorization: token $GIST_TOKEN" \
                -H "Accept: application/vnd.github.v3+json" \
                https://api.github.com/gists \
                -d "{\"description\":\"Daily Intelligence ${TODAY}\",\"public\":false,\"files\":{\"${FILE}\":{\"content\":\"$(cat $FILE | jq -Rs .)\"}}}")
              GIST_ID=$(echo $RESPONSE | jq -r .id)
              echo "GIST_ID=$GIST_ID" >> $GITHUB_ENV
              echo "Created new Gist: $GIST_ID"
            else
              curl -s -X PATCH \
                -H "Authorization: token $GIST_TOKEN" \
                -H "Accept: application/vnd.github.v3+json" \
                https://api.github.com/gists/$GIST_ID \
                -d "{\"files\":{\"${FILE}\":{\"content\":\"$(cat $FILE | jq -Rs .)\"}}}"
              echo "Updated Gist: $GIST_ID"
            fi
          fi
      
      - name: Summary
        run: |
          echo "## Daily Intelligence Collection Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f intel_summary_*.json ]; then
            cat intel_summary_*.json | jq -r "
              \"**Date**: \\(.date)\n\",
              \"**Total Raw**: \\(.total_raw)\n\",
              \"**Total Final**: \\(.total_final)\n\",
              \"**By Category**: \\(.by_category | to_entries | map(\"\\(.key): \\(.value)\") | join(\", \"))\n\",
              \"**By Priority**: \\(.by_priority | to_entries | map(\"\\(.key): \\(.value)\") | join(\", \"))\n\",
              \"**Top Keywords**: \\(.top_keywords | to_entries | sort_by(-.value) | .[:10] | map(\"\\(.key)(\\(.value))\") | join(\", \"))\n\"
            " >> $GITHUB_STEP_SUMMARY
          fi
