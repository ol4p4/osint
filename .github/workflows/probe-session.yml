name: OpenCode Session Probe (temporary)

# 临时探针（2026-10-12）：验证本机 OpenCode 桌面 session 能否在 CI 上复用。
#
# 背景：本地 4010 代理靠「官方桌面凭据 + 已登记 session」骗过上游免费层校验。
# 本地实测已确认（三组对照，只变一个变量）：
#   真 session + auth key        -> 200
#   真 session + OPENCODE_API_KEY -> 200   <- session 不绑定特定 key
#   无 session（任意 key）        -> 403 FreeTierError
#   伪造 session（同格式）        -> 403
# 即 session 是承重件，且**不绑定 key**；而 OPENCODE_API_KEY 云端已有。
# 唯一未知：session 是否绑定**发起它的机器/IP**。若是，搬上去也 403；
# 若否，云端可白得一条 opencode 通道（本地模型链同款，无需任何新凭据）。
#
# 本探针只做只读验证，不写任何仓库产物；测完即删。
# 用法：gh workflow run probe-session.yml
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Probe session reuse across machines
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OC_SESSION: ${{ secrets.OC_DESKTOP_SESSION }}
        run: |
          cd ${{ github.workspace }}
          python - <<'PY'
          import json, os, time, urllib.error, urllib.request

          key = os.environ.get("OPENCODE_API_KEY", "")
          sess = os.environ.get("OC_SESSION", "")
          print("注入检查: OPENCODE_API_KEY=%s  OC_DESKTOP_SESSION=%s"
                % (bool(key), bool(sess)))
          print()

          # 官方桌面标识（本地 4010 代理实测放行的那一套）
          UA = "opencode/1.18.28 ai-sdk/provider-utils/4.0.23 runtime/node.js/24"

          def call(label, use_sess, tools_on=True):
              body = {
                  "model": "mimo-v2.6-flash-free",
                  "messages": [{"role": "user", "content": "ok"}],
                  "stream": True,
                  "stream_options": {"include_usage": True},
                  "max_tokens": 32,
              }
              if tools_on:
                  # 上游放行条件之一：tools 里需含全部 6 个官方工具（按 function.name）
                  body["tools"] = [{"type": "function",
                                    "function": {"name": n,
                                                 "description": "d",
                                                 "parameters": {"type": "object", "properties": {}}}}
                                   for n in ("bash", "read", "write", "edit", "glob", "grep")]
                  body["tool_choice"] = "auto"
              h = {"Content-Type": "application/json",
                   "Authorization": "Bearer " + key,
                   "User-Agent": UA,
                   "x-opencode-client": "desktop"}
              if use_sess and sess:
                  h["x-opencode-session"] = sess
              t0 = time.time()
              try:
                  r = urllib.request.urlopen(
                      urllib.request.Request("https://opencode.ai/zen/v1/chat/completions",
                                             data=json.dumps(body).encode(), headers=h),
                      timeout=45)
                  print("  %-40s HTTP %s  %.1fs" % (label, r.status, time.time() - t0))
                  return True
              except urllib.error.HTTPError as e:
                  print("  %-40s HTTP %s  %.1fs  %s"
                        % (label, e.code, time.time() - t0, e.read()[:140]))
              except Exception as e:
                  print("  %-40s %s  %.1fs  %s"
                        % (label, type(e).__name__, time.time() - t0, str(e)[:100]))
              return False

          print("=== CI 上复用本机 session 的对照 ===")
          call("① CI: key + 本机 session", True)
          call("② CI: key + 无 session（基线）", False)
          PY
