name: JEV CI Probe (temporary)
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe jev-1.13-free (opencode zen, no key)
        run: |
          echo "=== runner 出口地区（用于判断是否地域封锁因素） ==="
          curl -s --max-time 15 https://ipinfo.io/json | head -c 300 || true
          echo
          echo "=== 1) models 端点（GET，无 key） ==="
          curl -s -o /dev/null -w "HTTP %{http_code}  time=%{time_total}s\n" \
            --max-time 20 https://opencode.ai/zen/v1/models || true
          echo
          echo "=== 2) systemone 端点 noul 原语（POST，无 key，jev-1.13-free） ==="
          CODE=$(curl -s -o /tmp/resp.json -w "%{http_code}" \
            --max-time 30 -X POST https://opencode.ai/zen/v1/systemone \
            -H "Content-Type: application/json" \
            -H "User-Agent: osint-jev-probe/1.0" \
            -d '{"model":"jev-1.13-free","state":"CI probe: test connectivity only.","questions":[{"type":"noul","text":"Is the sky blue? Answer yes or no."}]}')
          echo "HTTP $CODE"
          echo "--- response body (first 600 chars) ---"
          head -c 600 /tmp/resp.json || true
          echo
          echo "=== 3) 结论标记 ==="
          if [ "$CODE" = "200" ]; then
            echo "CI_PROBE_RESULT=OK — CI 境外网络可访问 jev-1.13-free"
          elif [ "$CODE" = "451" ]; then
            echo "CI_PROBE_RESULT=BLOCKED_451 — 同样被地域封锁，不是本地网络问题"
          else
            echo "CI_PROBE_RESULT=HTTP_$CODE — 见上方 body 判断"
          fi

      - name: Probe via project client (same code path as CI signal scan)
        run: |
          # 用仓库真实代码路径验证（jev_signal_scan 同款），不只是裸 curl
          python - <<'PY'
          import json, urllib.request, urllib.error
          url = "https://opencode.ai/zen/v1/systemone"
          payload = json.dumps({
              "model": "jev-1.13-free",
              "state": "CI probe via project path.",
              "questions": [{"type": "noul", "text": "Is water wet? Answer yes or no."}],
          }).encode()
          req = urllib.request.Request(url, data=payload, method="POST", headers={
              "Content-Type": "application/json",
              "User-Agent": "osint-jev/1.0",   # 与生产 client 相同 UA
          })
          try:
              with urllib.request.urlopen(req, timeout=30) as r:
                  d = json.loads(r.read().decode())
              print("PROJECT_CLIENT_RESULT=OK", r.status)
              qs = d.get("questions") or []
              print("answer sample:", json.dumps(qs[0])[:200] if qs else d)
          except urllib.error.HTTPError as e:
              print("PROJECT_CLIENT_RESULT=HTTP", e.code)
              print(e.read().decode("utf-8", "replace")[:400])
          except Exception as e:
              print("PROJECT_CLIENT_RESULT=ERR", type(e).__name__, str(e)[:200])
          PY
