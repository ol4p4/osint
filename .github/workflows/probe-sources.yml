name: Probe source reachability (temp)
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Probe hosts from CI runner
        run: |
          set +e
          probe() {
            name="$1"; url="$2"; shift 2
            code=$(curl -s -o /tmp/out -w "%{http_code}" --max-time 15 "$@" "$url" 2>/dev/null || echo ERR)
            size=$(wc -c < /tmp/out 2>/dev/null | tr -d ' ')
            echo "$name -> HTTP=$code size=${size}B"
          }
          probe "新浪实时汇率"     "https://hq.sinajs.cn/list=fx_susdcny" -H "Referer: https://finance.sina.com.cn"
          probe "TE-中国CPI页"     "https://tradingeconomics.com/china/inflation-cpi"
          probe "FRED-DGS10"      "https://fred.stlouisfed.org/graph/fredgraph.csv?id=DGS10"
          probe "WorldBank-中国GDP" "https://api.worldbank.org/v2/country/CHN/indicator/NY.GDP.MKTP.KD.ZG?format=json"
          probe "财新经济频道"      "https://economy.caixin.com/"
          probe "GDELT-DOC-API"   "https://api.gdeltproject.org/api/v2/doc/doc?query=china&format=json&maxrecords=5"
          probe "multpl-SP500PE"  "https://www.multpl.com/s-p-500-pe-ratio/table/by-month"
          probe "统计局-最新发布"   "https://www.stats.gov.cn/sj/zxfb/"
