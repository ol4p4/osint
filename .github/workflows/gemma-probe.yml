name: Gemma Probe (one-shot)

# 只测 Gemma 可用性与 TPM 压测（2026-10-13）。
# 独立于 cloud-translate-probe.yml —— 后者串了四个探针（含烧配额的重活），
# 跑一次要十几分钟，改 Gemma 候选名后没必要重跑全套。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gemma:
    runs-on: ubuntu-latest
    # 20 分钟：Gemma 稳定性测试要连发 15 次，而它 500/超时率高、平均每次 12s，
    # 首版设 8 分钟直接超时（实测 9m52s 被杀）。给足余量。
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Probe Gemma
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          cd ${{ github.workspace }}
          python tools/probe_gemma.py

      # 500 性质判定（2026-10-13）：首轮两个官方模型名均返 500（非 404），
      # 需区分"临时故障/未开通/端点差异"。约 1 分钟。
      - name: Probe Gemma 500 nature
        if: always()
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          cd ${{ github.workspace }}
          python tools/probe_gemma_retry.py || echo "gemma retry probe failed"

      # 稳定性与 TPM 压测（2026-10-13）：上一步判定 500 是临时的（重试第3次成功），
      # 但 500 率很高。本步量化成功率 + 测 TPM 16K 下翻译批能否通过 + 抽检译文。
      - name: Probe Gemma stability
        if: always()
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          cd ${{ github.workspace }}
          python tools/probe_gemma_stability.py || echo "gemma stability probe failed"
