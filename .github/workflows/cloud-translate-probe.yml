name: Cloud Translate Probe (one-shot)

# 一次性探针（2026-10-13）：实测 CI 能否用 Gemini 翻译英文条目。
# 跑完即可删除——它不是常规流水线的一部分。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install -q pyyaml
      - name: Probe cloud translation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DOTS_API_KEY: ${{ secrets.DOTS_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          cd ${{ github.workspace }}
          python tools/probe_cloud_translate.py

      # 配额探测（2026-10-13）：读 429 响应体里的 quotaValue/retryDelay，
      # 确认"15 RPM"是实测值还是文档值，并判断三模型配额是否独立。
      - name: Probe Gemini quota
        if: always()
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          cd ${{ github.workspace }}
          python tools/probe_gemini_quota.py || echo "quota probe failed"

      # 429 退避恢复验证（2026-10-13）：故意烧光三个模型的 RPM 桶，再调
      # generate() 看新加的"退避后重跑整链"是否真能恢复。约需 2 分钟。
      - name: Probe 429 recovery
        if: always()
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          cd ${{ github.workspace }}
          python tools/probe_429_recovery.py || echo "429 recovery probe failed"
