# 三观档案 - 参谋系统的个人视角锚点（世界观/人生观/价值观）
# 唯一事实源：修改后全链路（本地分析/每小时研判/问答/CI）自动生效
# 重新录入: python local/worldview_engine.py --interactive
worldview:
  summary: 世界运行在东亚现代化趋同与中国政策调整的交汇中，结构性力量决定机会分布。
  propositions:
  - 东亚中日韩现代化路径相似，政策响应趋同，青年就业压力和养老挑战同步出现。
  - 中国社会保障改革沿韩国路径推进，费率削减、延迟退休将逐步实施，影响个人现金流。
  - 十五五规划产业政策聚焦新质生产力，央企/国企投资方向创造特定领域就业窗口。
lifeview:
  summary: 在结构转折期，以技能积累和空间流动对冲风险，寻求稳定跃迁。
  propositions:
  - 优先积累可验证的技能证书（如注册工程师），提升在能源/电力等国家战略领域的竞争力。
  - 利用户籍改革和人才政策窗口，选择落户或就业于政策宽松城市，扩大空间选择。
  - 保持18个月行动向量，聚焦可执行任务，如技能提升、岗位筛选，避免短期投机。
values:
  summary: 坚持结构性机会映射和长期积累，拒绝福利陷阱和泡沫跟风。
  priorities:
  - 结构性机会识别
  - 技能与证书积累
  - 生存稳定保障
  - 风险规避
  red_lines:
  - 不依赖福利清单或政策匹配
  - 不参与短期投机或消费贷填补
analysis_directives:
- 优先从积累制度/空间/国家-市场/阶级四维角度分析机会，链接知识库如量化交易或AI产品开发，评估技能可迁移性。
- 警惕盲目考公/考编和AI泡沫培训，必须给出风险提示，如宏观流动性周期对个人现金流的影响。
