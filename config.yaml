# 本地配置 - 参谋长专用
# 注意：本文件在 git 里且仓库为 PUBLIC，禁止存放任何真实密钥。
# 真实 key 位置：本地 config.local.yaml（已gitignore）或环境变量 OPENCODE_API_KEY
# （CI 由 GitHub Secrets 注入；读取逻辑见 secrets_loader.py）

# AI API 配置（兼容OpenAI格式）
api:
  base_url: "https://opencode.ai/zen/v1"
  api_key: ""  # 密钥已于2026-08-30从本文件移除（仓库PUBLIC曾泄露，须在OpenCode平台重置）；真实值在 config.local.yaml 或 GitHub Secret OPENCODE_API_KEY
  model: "mimo-v2.5-free"
  # 备用模型（主模型失败时降级）
  # 2026-09-16 实测修正：deepseek-v4-flash-free 列在 /models 但调用返回
  # "Model is unavailable"（死模型）；muse-spark 系地区受限（403 RegionError）。
  # 替换为实测可用的 nemotron-3-ultra-free 与 ling-3.0-flash-fin-free。
  fallback_models:
    - base_url: "https://opencode.ai/zen/v1"
      model: "nemotron-3.5-lightning-free"
      api_key: ""  # 密钥已于2026-08-30从本文件移除（仓库PUBLIC曾泄露，须在OpenCode平台重置）；真实值在 config.local.yaml 或 GitHub Secret OPENCODE_API_KEY
    - base_url: "https://opencode.ai/zen/v1"
      model: "nemotron-3-ultra-free"
      api_key: ""  # 密钥已于2026-08-30从本文件移除（仓库PUBLIC曾泄露，须在OpenCode平台重置）；真实值在 config.local.yaml 或 GitHub Secret OPENCODE_API_KEY
    - base_url: "https://opencode.ai/zen/v1"
      model: "ling-3.0-flash-fin-free"
      api_key: ""  # 密钥已于2026-08-30从本文件移除（仓库PUBLIC曾泄露，须在OpenCode平台重置）；真实值在 config.local.yaml 或 GitHub Secret OPENCODE_API_KEY

# 运行模式
mode:
  # cloud: 仅拉取云端情报（GitHub Actions产物/Gist）
  # local: 完整本地运行（含采集+分析，需网络可达源站）
  # hybrid: 云端采集+本地分析（默认推荐）
  default: "hybrid"
  
  # 云端情报获取方式
  cloud_fetch:
    method: "gist"              # gist / artifact / local
    gist_id: ""                 # 私有Gist ID
    github_repo: ""             # 你的GitHub仓库 owner/repo
    artifact_name: "intel-daily" # Actions artifact名称

# 输出路径
paths:
  output_dir: "D:\\osint\\data"
  wiki_dir: "D:\\osint\\data\\wiki"
  intel_cache_dir: "D:\\osint\\data\\cache"
  log_dir: "D:\\osint\\data\\logs"

# 知识库路径（用于RAG检索）
knowledge_base:
  vault_path: "D:\\Codex输出\\视频知识库"
  index_file: "wiki\\index.md"
  concepts_dir: "wiki\\concepts"
  entities_dir: "wiki\\entities"
  comparisons_dir: "wiki\\comparisons"

# AI 深度分析参数
ai_analysis:
  # 每次送入 AI 的情报条数上限（按 final_score 降序取 Top N）
  # 2026-09-21 新增：此前全量送入，实测 1006 条 × batch_size 10 = 101 批，
  # 唯一可用通道 dots 实测 137s/批 → 需 3.8 小时，Step2 自 8-30 起从未跑完。
  # 60 条约 14 分钟，与周任务窗口匹配；调大前先确认 AI 通道吞吐。
  max_items: 60
  batch_size: 10               # 每批送 AI 的条数
  temperature: 0.3
  max_tokens_per_item: 800
  # 单次请求的输出预算（含推理模型 reasoning，实测 dots3 的 reasoning 与正文
  # 体量相当）。此前硬编码 8192 → 10 条 × 8 字段必截断（只写出 7 条）。
  # dots 实测接受 65536，取 32768 留余量。
  max_tokens_budget: 32768

# 输出格式控制
output:
  brief:
    enabled: true
    max_items: 15              # 简报包含的高优先级情报数
    include_reasoning: true    # 包含AI推理链
  
  dashboard:
    enabled: true
    theme: "dark"              # dark / light / auto
    chart_lib: "chartjs"       # chartjs / echarts
  
  wiki:
    enabled: true
    auto_link: true            # 自动生成双向链接
    update_index: true         # 自动更新index.md
    update_log: true           # 自动写入log.md

# 调度设置（本地定时运行用）
schedule:
  enabled: false               # 改为true启用本地定时
  time: "07:30"                # 每日运行时间
  timezone: "Asia/Shanghai"

# 日志级别
logging:
  level: "INFO"                # DEBUG / INFO / WARNING / ERROR
  file: true
  console: true


