# 权重参数配置 - 云端基础评分 + 本地深度研判共享
# 所有权重可热改，无需改代码

# 时效衰减：半衰期（小时），越新权重越高
time_decay:
  half_life_hours: 48      # 48小时衰减一半
  max_age_hours: 168       # 超过7天基础分乘0.1
  min_score: 0.1           # 最低保底分

# 来源基础权重（已在sources.yaml定义，这里作为覆盖/补充）
source_weights:
  gov: 1.3
  stats: 1.5
  thinktank: 1.2
  rss: 1.0
  social: 0.8
  biz: 0.9

# 关键词权重（已在sources.yaml定义，这里作为覆盖/补充）
# keyword_weights 在 sources.yaml 中定义

# 个人画像加成（本地参谋长专用）
# 当情报命中用户画像相关维度时，给予额外加成
persona_boost:
  # 用户画像标签及其加成系数
  tags:
    失业青年: 1.5
    求职: 1.5
    技能提升: 1.3
    考证: 1.3
    落户: 1.4
    户籍改革: 1.4
    就业补贴: 1.5
    创业扶持: 1.3
    选调生: 1.4
    基层就业: 1.3
    西部计划: 1.4
    国企招聘: 1.4
    央企招聘: 1.4
    注册工程师: 1.3
    造价师: 1.3
    咨询工程师: 1.3
    电气工程师: 1.3
    新能源就业: 1.4
    电力就业: 1.4
    核电就业: 1.4
    能源央企: 1.4
    宏观研判: 1.2
    资产配置: 1.2
    通胀对冲: 1.2

  # 维度权重（四维框架）
  dimension_weights:
    accumulation: 0.30     # 积累制度视角
    spatial: 0.25          # 空间修正视角
    state_market: 0.25     # 国家-市场边界视角
    class_interest: 0.20   # 阶级/利益集团视角

# 评分阈值
thresholds:
  high_priority: 0.75      # 高优先级，必读
  medium_priority: 0.50    # 中优先级，摘要阅读
  low_priority: 0.30       # 低优先级，仅归档
  archive_only: 0.15       # 仅归档不展示

# 去重阈值
dedup:
  simhash_threshold: 3     # SimHash汉明距离阈值
  title_jaccard_threshold: 0.7  # 标题Jaccard相似度阈值
  url_exact_match: true    # URL完全匹配去重

# AI分析参数
ai_analysis:
  batch_size: 10           # 批量送入AI的条目数
  max_tokens_per_item: 800 # 每条情报最大token
  temperature: 0.3         # 低温度保证结构化输出稳定
  max_retries: 3
  timeout_seconds: 60
